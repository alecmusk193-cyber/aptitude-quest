<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<style>
:root{--bg:#12121c;--wall:#1d1d2e;--floor:#2a2340;--desk:#8a5a34;--desktop:#a8723f;--card:#24243a;--text:#f2f2f7;--muted:#a9a9c0;--accent:#7c5cff;--gold:#ffc94d;
  --idle:#8e8ea8;--working:#4da3ff;--checking:#ffc94d;--done:#2ecc71;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#eef0f7;--wall:#e4e0f5;--floor:#d8cfe8;--desk:#9c6a3f;--desktop:#c48a52;--card:#fff;--text:#1c1c2b;--muted:#5d5d75;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:16px}
main{max-width:1000px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:1.5rem}
.meta{color:var(--muted);font-size:.9rem}
.note{margin:12px 0;padding:10px 14px;border-radius:12px;background:var(--card);border-left:4px solid var(--gold);font-size:.92rem}
.warn{border-left-color:#ff5c7a}
.room{position:relative;margin-top:12px;border-radius:20px;overflow:hidden;background:linear-gradient(var(--wall) 0 38%,var(--floor) 38%);padding:24px 16px 20px}
.room::before{content:"🪟  🖼️  🕒";position:absolute;top:14px;left:0;right:0;text-align:center;font-size:1.8rem;letter-spacing:40px;opacity:.6}
.room::after{content:"🪴";position:absolute;right:12px;bottom:10px;font-size:2rem}
.desks{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-top:56px}
.station{display:flex;flex-direction:column;align-items:center}
.bubble{position:relative;max-width:100%;padding:8px 12px;border-radius:14px;background:var(--card);box-shadow:0 6px 18px #0004;font-size:.85rem;text-align:center;margin-bottom:10px;border:2px solid var(--st)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--st);border-bottom:0}
.state{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--st);color:#111;font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.task{display:block;overflow-wrap:anywhere}
.avatar{font-size:2.6rem;line-height:1;z-index:1;margin-right:60px}
.working .avatar{animation:bob .8s ease-in-out infinite}
.checking .avatar{animation:tilt 1.4s ease-in-out infinite}
.done .avatar{animation:hop .6s ease-out 2}
.desk{position:relative;width:180px;height:56px;margin-top:-6px;border-radius:8px 8px 4px 4px;background:linear-gradient(var(--desktop) 0 30%,var(--desk) 30%)}
.desk::before{content:"";position:absolute;left:72%;top:-30px;width:46px;height:32px;margin-left:-23px;border-radius:4px;background:#222;border:3px solid #444;box-shadow:inset 0 0 0 2px var(--st)}
.desk::after{content:"";position:absolute;left:14px;right:14px;bottom:-14px;height:14px;border-left:6px solid var(--desk);border-right:6px solid var(--desk)}
.name{margin-top:20px;font-weight:700}
.bar{width:180px;height:10px;margin-top:6px;border-radius:99px;background:#0004;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--st));transition:width .5s}
.small{font-size:.78rem;color:var(--muted);margin-top:4px}
.s-idle{--st:var(--idle)}.s-working{--st:var(--working)}.s-checking{--st:var(--checking)}.s-done{--st:var(--done)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--st);margin-right:4px}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes tilt{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes hop{50%{transform:translateY(-12px)}}
@media(prefers-reduced-motion:reduce){.avatar{animation:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>🏢 Agent Office</h1>
    <span class="meta" id="meta">Loading status.js…</span>
  </header>
  <div class="note">ℹ️ This view shows what agents <b>report</b> in <code>status.js</code> when they start and finish tasks. It is not a live view of their internals, so a "working" agent may have moved on since its last update.</div>
  <div class="note warn" id="err" hidden></div>
  <section class="room" aria-label="Office floor"><div class="desks" id="desks"></div></section>
  <div class="legend"><span class="s-idle"><i></i>idle</span><span class="s-working"><i></i>working</span><span class="s-checking"><i></i>checking</span><span class="s-done"><i></i>done</span></div>
</main>
<script>
const STATES=["idle","working","checking","done"];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=iso=>{const s=Math.round((Date.now()-new Date(iso))/1000);if(!isFinite(s))return"unknown";if(s<60)return Math.max(0,s)+"s ago";if(s<3600)return Math.round(s/60)+"m ago";return Math.round(s/3600)+"h ago"};
let lastOk=0;

function render(){
  const S=window.AGENT_STATUS,err=document.getElementById("err");
  if(!S||!Array.isArray(S.agents)){err.hidden=false;err.textContent="⚠️ Could not read status.js (missing or invalid). Retrying every 2 seconds…";return}
  err.hidden=true;lastOk=Date.now();
  document.getElementById("meta").textContent=`${S.agents.length} agents · last report ${ago(S.updated)} · refreshes every 2s`;
  document.getElementById("desks").innerHTML=S.agents.map(a=>{
    const st=STATES.includes(a.state)?a.state:"idle",p=Math.max(0,Math.min(100,+a.progress||0));
    return `<div class="station s-${st} ${st}">
      <div class="bubble"><span class="state">${st}</span><span class="task">${esc(a.task)||"—"}</span></div>
      <div class="avatar" aria-hidden="true">${esc(a.avatar||"🤖")}</div>
      <div class="desk"></div>
      <div class="name">${esc(a.name||a.id)}</div>
      <div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><div style="width:${p}%"></div></div>
      <div class="small">${p}% · updated ${ago(a.updated)}</div></div>`}).join("");
}

// Re-inject status.js with a cache-buster: works on file:// where fetch/XHR are blocked.
function poll(){
  document.querySelectorAll("script[data-status]").forEach(s=>s.remove());
  window.AGENT_STATUS=undefined;
  const s=document.createElement("script");
  s.dataset.status="1";s.src="status.js?t="+Date.now();
  s.onload=render;s.onerror=render;
  document.head.appendChild(s);
}
poll();setInterval(poll,2000);
</script>
</body>
</html>
