<!DOCTYPE html>
<html lang="en">
<head>

<title>Aptitude Quest</title>
<style>
:root{--bg:#12121c;--bg2:#2a1f55;--card:#1d1d2e;--opt:#2a2a40;--line:#444;--track:#0006;--accent:#7c5cff;--good:#2ecc71;--bad:#ff5c7a;--gold:#ffc94d;--text:#f2f2f7;--goodbg:#1f5e3a;--badbg:#6b2335;--shadow:#0008;color-scheme:dark}
[data-theme=light]{--bg:#eef0f7;--bg2:#d9d0ff;--card:#fff;--opt:#f0f0f7;--line:#c8c8d8;--track:#0000001a;--text:#1c1c2b;--goodbg:#d5f5e3;--badbg:#ffdbe2;--shadow:#3a2f7a22;color-scheme:light}
:root{--pad:16px;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
/* Mobile-first: full-height single column, no double-tap zoom, no pull-to-refresh, no accidental selection */
html{font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg) 60%);color:var(--text);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;width:100%;max-width:560px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--card);padding:calc(12px + var(--st)) calc(var(--pad) + var(--sr)) 0 calc(var(--pad) + var(--sl))}
.screen{padding-bottom:16px}
/* Thumb zone: primary action pinned to the bottom, above the home indicator */
.dock{position:sticky;bottom:0;z-index:5;display:grid;gap:8px;margin:auto calc(-1*(var(--pad) + var(--sr))) 0 calc(-1*(var(--pad) + var(--sl)));padding:12px calc(var(--pad) + var(--sr)) calc(12px + var(--sb)) calc(var(--pad) + var(--sl));background:var(--card);box-shadow:0 -10px 18px -12px var(--shadow)}
@media(min-width:640px) and (min-height:640px){body{padding:24px 16px}#app{--pad:24px;min-height:0;padding-top:22px;border-radius:20px;box-shadow:0 20px 60px var(--shadow)}.dock{border-radius:0 0 20px 20px}}
h1{margin:0;font-size:1.45rem;line-height:1.2}h2{margin:12px 0;line-height:1.35;font-size:1.15rem}h3{margin:20px 0 8px;font-size:1.05rem}
.sub{opacity:.7;margin:4px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tools{display:flex;gap:8px;flex:none}
.icon{display:grid;place-items:center;flex:none;width:48px;height:48px;padding:0;border-radius:14px;border:2px solid var(--line);background:transparent;font-size:1.2rem}
.qhead{display:flex;align-items:center;gap:8px}.qhead .grow{flex:1;min-width:0;font-size:.9rem;opacity:.85}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.alt{min-height:50px;padding:12px;border-radius:14px;border:2px solid var(--accent);background:transparent;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.grid2 .wide{grid-column:1/-1}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.card{background:var(--opt);border-radius:12px;padding:10px 6px;text-align:center}
.big{font-size:1.15rem;font-weight:700}
.weak,.note,.tip{margin-top:12px;padding:12px;border-radius:12px;background:var(--opt);border-left:4px solid var(--gold)}
.weak{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btns{display:flex;gap:8px}
/* DI tables: scroll sideways inside their box, first column stays visible */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;margin:10px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;min-width:100%;font-size:.95rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--opt);font-size:.85rem}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);box-shadow:1px 0 0 var(--line)}th:first-child{background:var(--opt)}
.hint{margin:-4px 0 6px;font-size:.8rem;opacity:.7}
.opts{display:grid;gap:10px;margin:14px 0 4px}
.opt kbd{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--track);font:inherit;font-size:.85rem;font-weight:700}
.opt:disabled{cursor:default}
#fb{scroll-margin-bottom:110px}
textarea{width:100%;min-height:180px;margin-top:12px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--opt);color:var(--text);font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:text;user-select:text;resize:vertical}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--opt))}
.pal{display:flex;gap:6px;overflow-x:auto;margin:14px 0 4px;padding:4px 2px;scrollbar-width:thin}
.pb{flex:none;min-width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;font-weight:700}
.pb.done{background:var(--opt);border-color:var(--accent)}.pb.cur{outline:3px solid var(--gold);outline-offset:1px}
.clock{font-variant-numeric:tabular-nums;font-size:1.1rem;flex:none}.clock.warn{color:var(--bad)}
.btns2{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.score{margin:12px 0;padding:14px;border-radius:14px;background:var(--opt);text-align:center}.score .big{font-size:2rem}
.whys{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.whys li{padding:10px 12px;border-radius:12px;background:var(--opt);border-left:4px solid var(--line);font-size:.95rem}
.whys li.w-ok{border-left-color:var(--good)}.whys li.w-bad{border-left-color:var(--bad)}.whys span{opacity:.88}
.trap{margin-top:12px;padding:12px;border-radius:12px;background:var(--badbg);border-left:4px solid var(--bad)}
details.more,details.rv{margin-top:10px;padding:0 12px;border-radius:12px;background:var(--opt)}
details summary{display:flex;align-items:center;gap:8px;min-height:48px;cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open]{padding-bottom:12px}details.more .whys li,details.rv .whys li{background:var(--card)}
details.rv summary .grow{flex:1;min-width:0;font-weight:500;font-size:.92rem}
#rv.only-bad .rv.ok{display:none}
.small{font-size:.85rem;opacity:.8;font-weight:400}
.errs{margin:6px 0 0;padding-left:18px;font-size:.88rem;-webkit-user-select:text;user-select:text}
.warnb{border-left-color:var(--bad)}
.lvtag{padding:1px 8px;border-radius:99px;background:var(--opt);font-size:.85rem}
.lvchg{border-left-color:var(--accent)}
#fb h3{margin:16px 0 4px}
.mmcard{margin:14px 0 6px;padding:16px 14px;border-radius:16px;background:var(--opt);text-align:center}
.mmcat{font-size:.85rem;opacity:.75}
.mmq{margin:8px 0 4px;font-size:2.1rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mmnote{font-size:.9rem;opacity:.8}
.mmans{margin-top:12px;min-height:54px;padding:8px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.mmans.ok{border-color:var(--good);background:var(--goodbg)}.mmans.bad{border-color:var(--bad);background:var(--badbg)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{min-height:52px;padding:0;border:0;border-radius:12px;background:var(--opt);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.key.fn{background:var(--track)}.key.go{grid-column:span 2;background:var(--accent);color:#fff;font-size:1.1rem}
.key:active{transform:scale(.96)}
.keypad.fb .key:not(.go){display:none}.keypad.fb .key.go{grid-column:1/-1}
#mmFb{scroll-margin-bottom:100px}
.mmlist{display:grid;gap:8px}
.mmrow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid transparent;background:var(--opt);text-align:left}
@media(hover:hover){.mmrow:hover{border-color:var(--accent)}}
.stars{flex:none;color:var(--gold);letter-spacing:2px}
.mmbtn{border-color:var(--gold)}
.gread{-webkit-user-select:text;user-select:text}.gread p{line-height:1.6}
.gbox{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--opt);border-left:4px solid var(--accent)}
.gbox.fast{border-left-color:var(--gold)}.gbox.rem{border-left-color:var(--good)}.gbox.trapb{border-left-color:var(--bad)}
.gh{margin-bottom:6px;font-weight:800}
.gbox ol,.gbox ul{margin:0;padding-left:20px;line-height:1.55}.gbox li{margin:4px 0}
.gex,.gchk{margin:14px 0;padding:12px 14px;border-radius:12px;border:2px solid var(--line)}
.gq{font-weight:600;line-height:1.5;white-space:pre-line}
.gwhy .note,.gwhy .trap{margin-top:10px;line-height:1.5}
.gtopics{display:grid;gap:8px;margin-top:14px}
.gtopic{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border-radius:14px;border:2px solid transparent;background:var(--opt);text-align:left}
@media(hover:hover){.gtopic:hover{border-color:var(--accent)}}
.gi{flex:none;font-size:1.6rem}.gpct{flex:none;font-weight:800;color:var(--gold)}
.gnum{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--track);font-weight:800}.gnum.done{background:var(--good);color:#fff}
.gbtn{border-color:var(--good)}
.cobtn{border-color:#4dd0ff}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btag{display:inline-block;margin:0 2px;padding:1px 7px;border-radius:99px;font-size:.72rem;font-weight:700;vertical-align:middle;white-space:nowrap}
.b-off{background:var(--goodbg);color:var(--text);border:1px solid var(--good)}.b-rep{background:var(--opt);border:1px solid var(--gold)}.b-gen{background:var(--opt);border:1px solid var(--line)}
.srcref{margin-left:2px;font-size:.78rem;color:var(--accent);text-decoration:none;font-weight:700}
.coul,.costages{padding-left:20px;line-height:1.55}.coul li,.costages>li{margin:8px 0}
.cotips{list-style:none;padding:0;margin:6px 0 0}.cotips li{margin:4px 0;font-size:.95rem}
.srcs{padding-left:22px;font-size:.88rem;line-height:1.5;overflow-wrap:anywhere}.srcs a{color:var(--accent)}
.srcs li.flash{background:var(--opt);border-radius:6px}
.gcheat{width:100%;margin:6px 0 12px}

.lead{font-size:1.05rem;line-height:1.5}
.steps{margin:6px 0;padding-left:22px;line-height:1.5}.steps li{margin:4px 0}
.mmex{margin:10px 0;padding:12px;border-radius:12px;background:var(--opt)}.mmexq{font-size:1.15rem;font-variant-numeric:tabular-nums}


.face{flex:none;position:relative;width:40px;height:40px;border-radius:50%;background:var(--gold);box-shadow:inset -3px -3px 0 #0002}
.face::before{content:"";position:absolute;top:13px;left:11px;width:5px;height:6px;border-radius:50%;background:#222;box-shadow:13px 0 #222}
.face::after{content:"";position:absolute;left:11px;width:18px;height:9px;border:3px solid #222}
.face.happy::after{top:19px;border-top:0;border-radius:0 0 18px 18px}
.face.sad::after{top:25px;border-bottom:0;border-radius:18px 18px 0 0}
.face.wow::after{top:22px;left:15px;width:10px;height:11px;border-radius:50%}
.face.cool::before{top:12px;left:7px;width:26px;height:6px;border-radius:1px 1px 6px 6px;border-top:2px solid #111;background:linear-gradient(90deg,#111 0 11px,transparent 11px 15px,#111 15px 26px);box-shadow:none}
.face.cool::after{top:23px;left:15px;width:12px;height:5px;border:3px solid #222;border-top:0;border-left:0;border-radius:0 0 10px 0;transform:rotate(-10deg)}
.joke{margin-top:6px;font-size:.92rem;opacity:.85;font-style:italic}
.lvlup{margin:10px 0;padding:12px;border-radius:12px;text-align:center;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--gold));color:#fff;animation:pop .4s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .2s linear}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.main{width:100%;min-height:54px;padding:14px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:1.05rem}
.main:disabled{opacity:.45;cursor:default}
.opt{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;margin:0;padding:12px 14px;text-align:left;background:var(--opt);border:2px solid transparent;border-radius:14px;font-size:1rem;transition:transform .08s}
.opt:active:not(:disabled){transform:scale(.98)}
@media(hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
@media(hover:none){.kb{display:none}}
.opt.good{background:var(--goodbg);border-color:var(--good)}
.opt.bad{background:var(--badbg);border-color:var(--bad);animation:shake .3s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{min-height:48px;padding:8px 16px;border-radius:99px;border:2px solid var(--line);background:transparent}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--opt);font-size:.9rem;line-height:1.25}
.badge small{display:block;opacity:.75;font-size:.78rem}
.badge.locked{opacity:.45;filter:grayscale(1)}
.meme{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px;border-radius:12px;font-weight:700;animation:pop .3s}
.meme.good{background:var(--goodbg)}.meme.bad{background:var(--badbg)}
.exp{opacity:.85}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script src="questions.js"></script>

<script>
const TOPICS=["Quant","Logical","Verbal","DI","SJT"];
const TOPIC_NAME={Quant:"Quant",Logical:"Logical",Verbal:"Verbal",DI:"Data (DI)",SJT:"Situational (SJT)"};
// All question text is escaped before rendering (imported questions are untrusted).
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CUSTOM_KEY="aq-custom";
function loadCustom(){try{const a=JSON.parse(localStorage.getItem(CUSTOM_KEY));return Array.isArray(a)?a:[]}catch(e){return[]}}
let CUSTOM=loadCustom();
let BANK=(window.QUESTIONS||[]).concat(CUSTOM.map(q=>Object.assign({},q,{custom:true})));
const GEN=window.QGEN||null;
const MEMES={"good":["Big brain energy 🧠","Calculator? Never heard of her 💅","Stonks 📈","Absolute cinema 🎬","You did that. Tell your mom 🏆","Brain cells: 1, Procrastination: 0 🥊","Brain said 'I got this' and it did 🧠✨","Main character moment unlocked 🌟","No notes. Chef's kiss 👨‍🍳💋","You understood the assignment 📝✅","That answer was illegal-level smart 🚨😎","Neurons firing in 4K 🎥⚡","Certified smart cookie 🍪","Galaxy brain activated 🌌🧠","Correct! Your future self says thanks 🙏","Not a guess. Pure skill 🎯","The math is mathing today 📐💯","Slay, but make it aptitude 💅📊"],"bad":["Task failed successfully 🫠","Ah yes, the classic 'I knew that' 🙃","This is fine 🔥☕ (it is not fine)","Brain.exe has stopped working 💥","Not like this 😭","Me after reading the question 5 times 👀","Plot twist: that was not it 🌀","Oops! Every expert started here too 🌱","Wrong, but your vibes are immaculate 😌✨","Brain buffering... please try again 🔄","We don't lose, we learn. Respectfully 📚","My brain had 47 tabs open 🗂️😵","Close-ish! Next one's yours 💪","That answer was a side quest 🗺️😅","Mistakes are just XP in disguise 🎮","Not today, but definitely someday 🌅","Shake it off and lock in 🔒🧠","Even calculators need a reboot sometimes 🔌"],"time":["Time ran out. The clock said bye 👋⏰","You blinked. The timer didn't 😵","Thinking so hard you left the dimension 🌌","The timer said 'it's giving overtime' ⌛😬","Still thinking? The clock clocked out 🕰️💤","Brain loading... timer wasn't 🐢","Time's up! Deep thoughts though 🤔💭","You were vibing, the clock was not ⏱️🎶","Speedrun next time, bestie 🏃💨"],"near":{"good":["Clutch! Answered with the clock on fumes ⏳🔥","Last-second genius. Heart rate: 180 💓","Living dangerously and still right 😅","Saved by the final tick! ⏱️🙌","Cutting it close and nailing it 😤🎯","Last-moment legend behaviour 🦸⏳","The clock blinked first 😎⌛","Zero chill, full marks 🧊💯","Answered at 0.1% battery. Iconic 🔋🔥"],"bad":["Buzzer-beater... that missed 🏀😬","The clock pressured you and it worked 🫣","Panic mode: on. Accuracy: off 🚨","So close the clock felt bad 🥲⏰","Rushed it. The pressure was real 😮‍💨","Final-second gamble didn't pay 🎲😅","Clock: 1, You: 0. Rematch? ⚔️","Speed was there, accuracy took a nap 😴","Photo finish, wrong lane 📸🏁"]},"streak":{"3":["Hat trick! 3 in a row 🎩","Three-peat! The brain is warming up ♨️","Triple threat! Keep it rolling 🎲🔥","3 for 3. We see you 👀✨","Combo started! Don't stop now ▶️","Three wins. The warm-up is over 🏃‍♀️"],"5":["5 in a row! You're on fire 🔥🔥","Five straight. Main character energy ✨","5 streak! Brain is fully caffeinated ☕🧠","High five! Literally 🖐️🔥","Five in a row. Lowkey a genius 🤫💡","Combo x5! Lock in and keep going 🔒⚡"],"10":["10 IN A ROW. Unstoppable 🚀","Ten straight! Somebody call the exam board 📞","10 streak!! Legendary status 👑🌟","Double digits! Are you even human? 🤖💯","Ten straight. Write this in the history books 📜","x10 combo. The question bank is scared 😱🚀"]}};

  c.className="confetti";document.body.appendChild(c);const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=["#7c5cff","#ffc94d","#2ecc71","#ff5c7a","#4dd0ff"],n=(navigator.hardwareConcurrency||4)<=4?45:80;
  const ps=Array.from({length:n},()=>({x:W/2,y:H/3,vx:(Math.random()-.5)*12,vy:-Math.random()*11-4,s:Math.random()*5+5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));
  const t0=performance.now();

    for(const p of ps){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;const co=Math.cos(p.r),si=Math.sin(p.r);

// ---- Adaptive difficulty (1-3): up after 3 correct in a row, down after 2 wrong in a row. Saved per topic. ----
function pickAdaptive(){
  const lv=G.level,tps=G.topicSel==="All"?TOPICS.filter(t=>BANK.some(q=>q.topic===t)||(t==="Quant"&&GEN)):[G.topicSel],t=pick(tps);
  const bankAt=d=>BANK.filter(q=>q.topic===t&&q.difficulty===d&&!G.seen.has(q.id));
  if(t==="Quant"&&GEN&&(Math.random()<.5||!bankAt(lv).length)){
    const ids=GEN.byDifficulty(lv).length?GEN.byDifficulty(lv):GEN.byDifficulty(2),q=GEN.generate(pick(ids));if(q)return q}
  for(const d of [lv,lv+1,lv-1,lv+2,lv-2]){const c=bankAt(d);if(c.length)return pick(c)}
  const any=BANK.filter(q=>q.topic===t);return any.length?pick(any):(GEN?GEN.generate():null)}
function adaptStep(ok){if(!G.adaptive)return 0;let ch=0;
  if(ok){G.up++;G.down=0;if(G.up>=3&&G.level<3){G.level++;G.up=0;ch=1}}
  else{G.down++;G.up=0;if(G.down>=2&&G.level>1){G.level--;G.down=0;ch=-1}}
  P.adapt[G.key]=G.level;return ch}

function mockPickQs(cfg){

    for(const [t,n] of Object.entries(cfg.topics)){if(!n)continue;const pool=shuffle(BANK.filter(q=>q.topic===t&&!q.custom)),take=[];
      for(let i=0;i<n;i++){const d=diffs[i%diffs.length];
        if(t==="Quant"&&GEN&&(i%2===1||take.length>=pool.length)){const ids=GEN.byDifficulty(d).length?GEN.byDifficulty(d):GEN.byDifficulty(2),g=GEN.generate(pick(ids));if(g){take.push(g);continue}}

      qs.push(...take)}

      const c=pool.find(q=>q.difficulty===d&&!take.includes(q))||pool.find(q=>!take.includes(q));if(c)take.push(c)}
    qs.push(...take)});

const IMPORT_EXAMPLE=[{id:"my-001",topic:"Quant",difficulty:2,q:"A price rises from $80 to $100. What is the percentage increase?",o:["20%","25%","80%","125%"],a:1,
  e:"(100 − 80) / 80 × 100 = 25%.",tip:"Divide the change by the original value.",
  why:["Divides the change by the new price (wrong base).","Correct: 20 / 80 = 25%.","Old price as a percentage of the new.","New price as a percentage of the old."]}];
const normT=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const qSig=q=>normT(q.q)+"|"+JSON.stringify(q.data||"");
function validateQ(q,ids,sigs){const E=[],str=(v,min,max)=>typeof v==="string"&&v.trim().length>=min&&v.length<=max;
  if(!q||typeof q!=="object"||Array.isArray(q))return["not an object"];
  if(!str(q.id,1,40)||!/^[A-Za-z0-9_-]+$/.test(q.id))E.push("id must be 1–40 letters, digits, - or _");else if(ids.has(q.id))E.push(`id "${q.id}" already exists`);
  if(!TOPICS.includes(q.topic))E.push("topic must be one of "+TOPICS.join(", "));
  if(![1,2,3].includes(q.difficulty))E.push("difficulty must be 1, 2 or 3");
  if(!str(q.q,8,1200))E.push("q (question) must be 8–1200 characters");else if(sigs.has(qSig(q)))E.push("duplicate of an existing question");
  if(!Array.isArray(q.o)||q.o.length!==4||q.o.some(o=>!str(o,1,300)))E.push("o must be exactly 4 non-empty options");else if(new Set(q.o.map(normT)).size!==4)E.push("the 4 options must all be different");
  if(!Number.isInteger(q.a)||q.a<0||q.a>3)E.push("a must be 0, 1, 2 or 3 (index of the correct option)");
  if(!str(q.e,3,1500))E.push("e (explanation) is required");
  if(q.tip!==undefined&&!str(q.tip,1,400))E.push("tip must be text");
  if(q.why!==undefined&&(!Array.isArray(q.why)||q.why.length!==4||q.why.some(w=>!str(w,1,400))))E.push("why must be 4 reasons, one per option");
  if(q.topic==="DI"||q.data!==undefined){const d=q.data;
    if(!d||!Array.isArray(d.headers)||!d.headers.length||d.headers.length>8||!Array.isArray(d.rows)||!d.rows.length||d.rows.length>30)E.push("DI needs data with 1–8 headers and 1–30 rows");
    else if(d.rows.some(r=>!Array.isArray(r)||r.length!==d.headers.length||r.some(c=>!(typeof c==="string"||typeof c==="number"))))E.push("each data row needs one text/number cell per header")}
  return E}
function importScreen(){clearInterval(tick);if(G)G.over=true;if(M&&!M.over){mockLeave();saveRun()}M=null;
  $("#app").innerHTML=`<div class="screen">
  <div class="qhead"><button class="icon" onclick="home()" aria-label="Back to home">✕</button><span class="grow"><b>Import questions</b></span></div>

  <textarea id="imp" rows="10" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Questions as JSON" placeholder='[{"id":"my-001","topic":"Quant","difficulty":2,"q":"...","o":["A","B","C","D"],"a":1,"e":"..."}]'></textarea>
  <div class="grid2"><button class="alt" onclick="impExample()">Insert example</button><button class="alt" id="impRm" onclick="impClear()" ${CUSTOM.length?"":"disabled"}>Remove imported (${CUSTOM.length})</button></div>
  <div id="impres" role="status"></div>
  <details class="more"><summary>Format</summary><ul class="whys">
    <li><b>id</b>: unique text, e.g. "my-001"</li><li><b>topic</b>: ${TOPICS.join(", ")}</li><li><b>difficulty</b>: 1, 2 or 3</li>
    <li><b>q</b>: question text</li><li><b>o</b>: exactly 4 different options</li><li><b>a</b>: index of the correct option (0–3)</li>
    <li><b>e</b>: explanation</li><li><b>tip</b> (optional): one-line shortcut</li><li><b>why</b> (optional): 4 reasons, one per option</li>
    <li><b>data</b> (required for DI): {"headers":[...], "rows":[[...], ...]}</li></ul></details></div>
  <div class="dock"><button class="main" onclick="doImport()">Validate &amp; import</button></div>`;scrollTo(0,0)}
function impExample(){$("#imp").value=JSON.stringify(IMPORT_EXAMPLE,null,1)}
function doImport(){const out=$("#impres"),raw=$("#imp").value.trim();
  if(!raw){out.innerHTML=`<div class="note">Paste a JSON array first.</div>`;return}
  let arr;try{arr=JSON.parse(raw)}catch(e){out.innerHTML=`<div class="note warnb">That isn't valid JSON: ${esc(e.message)}</div>`;return}
  if(!Array.isArray(arr))arr=[arr];
  if(arr.length>500){out.innerHTML=`<div class="note warnb">Please import at most 500 questions at a time.</div>`;return}
  const ids=new Set(BANK.map(q=>q.id)),sigs=new Set(BANK.map(qSig)),ok=[],bad=[];
  arr.forEach((q,i)=>{const e=validateQ(q,ids,sigs);
    if(e.length){bad.push(`#${i+1}${q&&typeof q.id==="string"?" ("+q.id+")":""}: ${e.join("; ")}`);return}
    const c={id:q.id,topic:q.topic,difficulty:q.difficulty,q:q.q.trim(),o:q.o.map(s=>s.trim()),a:q.a,e:q.e.trim()};
    if(q.tip)c.tip=q.tip.trim();if(q.why)c.why=q.why.map(s=>s.trim());if(q.data)c.data={headers:q.data.headers.map(String),rows:q.data.rows.map(r=>r.slice())};
    ok.push(c);ids.add(c.id);sigs.add(qSig(c))});
  if(ok.length){const nx=CUSTOM.concat(ok);
    try{localStorage.setItem(CUSTOM_KEY,JSON.stringify(nx))}catch(e){out.innerHTML=`<div class="note warnb">Couldn't save on this device (storage is full or blocked). Nothing was imported.</div>`;return}
    CUSTOM=nx;BANK=BANK.concat(ok.map(q=>Object.assign({},q,{custom:true})))}
  out.innerHTML=`<div class="note${bad.length&&!ok.length?" warnb":""}">${ok.length?`✅ Imported ${ok.length} question${ok.length>1?"s":""}. They now appear in practice and review.`:"Nothing was imported."}${bad.length?`<br><b>Skipped ${bad.length}:</b><ul class="errs">${bad.slice(0,15).map(b=>`<li>${esc(b)}</li>`).join("")}</ul>${bad.length>15?`…and ${bad.length-15} more`:""}`:""}</div>`;
  const rm=$("#impRm");if(rm){rm.disabled=!CUSTOM.length;rm.textContent=`Remove imported (${CUSTOM.length})`}}
function impClear(){if(!confirm(`Remove all ${CUSTOM.length} imported questions from this device?`))return;
  try{localStorage.removeItem(CUSTOM_KEY)}catch(e){}CUSTOM=[];BANK=BANK.filter(q=>!q.custom);importScreen()}

function mmPickTrick(){if(MMS.mode==="trick")return MMS.id;
  const all=MMX.tricks.map(t=>{const s=mmSt(t.id),acc=s.n?s.r/s.n:.5;return{id:t.id,w:MMS.mode==="sprint"?1:1+(1-acc)*3+(s.n<5?1:0)}});

function mmCheck(skip){const it=MMS.cur;if(!skip&&!/\d/.test(MMS.input))return;

function mmResults(){if(!MMS)return;clearInterval(tick);clearTimeout(MMS.fbT);const S=MMS;MMS=null;
  const n=S.items.length,acc=n?Math.round(S.right/n*100):0,avg=n?S.items.reduce((s,x)=>s+x.secs,0)/n:0;

function guideHub(){mmLeaveAll();if(!GD.length)return home("The study guide didn't load.");

function guideTopic(id){const T=GD.find(t=>t.id===id);if(!T)return guideHub();mmLeaveAll();const nx=gdNext([T]);

function guideBlock(C,b,k){
  if(b.t==="p")return`<p>${gdT(b.text)}</p>`;
  if(b.t==="fast")return`<div class="gbox fast"><div class="gh">⚡ ${esc(b.title||"Cách nhanh nhất")}</div><ol>${gdList(b.items,1)}</ol></div>`;
  if(b.t==="remember")return`<div class="gbox rem"><div class="gh">🧠 ${esc(b.title||"Cần nhớ")}</div><ul>${gdList(b.items)}</ul></div>`;
  if(b.t==="trap")return`<div class="gbox trapb"><div class="gh">🪤 ${esc(b.title||"Bẫy hay gặp")}</div><ul>${gdList(b.items)}</ul></div>`;
  if(b.t==="table")return`${b.caption?`<p class="small"><b>${gdT(b.caption)}</b></p>`:""}${table({headers:b.headers,rows:b.rows})}`;
  if(b.t==="example")return`<div class="gex"><div class="gh">✍️ ${esc(b.title||"Ví dụ")}</div><p class="gq">${gdT(b.q)}</p>
    <details class="more"><summary>Tự giải trước, rồi bấm để xem lời giải</summary><ol class="steps">${gdList(b.steps,1)}</ol><p><b>Đáp án:</b> ${gdT(b.answer)}</p>${b.fast?`<div class="tip">⚡ Cách nhanh: ${gdT(b.fast)}</div>`:""}</details></div>`;
  if(b.t==="check"){const prev=gdP().chk[C.id+"#"+k];
    return`<div class="gchk" id="gc${k}"><div class="gh">✅ Tự kiểm tra</div><p class="gq">${gdT(b.q)}</p>
    <div class="opts">${b.o.map((o,j)=>`<button class="opt" onclick="guideCheck('${C.id}',${k},${j})"><kbd>${"ABCD"[j]}</kbd><span>${gdT(o)}</span></button>`).join("")}</div>
    <div class="gwhy"></div>${prev!==undefined?`<p class="small">Lần trước: ${prev?"đúng ✓":"chưa đúng"}</p>`:""}</div>`}
  return""}
function guideChapter(id){const f=gdFind(id);if(!f)return guideHub();mmLeaveAll();const {T,C,i}=f,last=i===T.chapters.length-1,pr=C.practice;

    <button class="alt" onclick="${pr.trick?`guideDone('${C.id}');mmLesson('${pr.trick}')`:`guideDone('${C.id}');topic='${pr.topic}';start()`}">Luyện ▶</button></div>`:""}</div>
  <div class="dock"><div class="btns2"><button class="alt" onclick="guidePrev('${C.id}')" ${i===0?"disabled":""}>◀ Trước</button>

function guideNextCh(id){guideDone(id);SFX.click();const {T,i}=gdFind(id);if(i<T.chapters.length-1)guideChapter(T.chapters[i+1].id);else guideTopic(T.id)}

function guideCheck(cid,k,j){const {C}=gdFind(cid),b=C.blocks[k],box=document.getElementById("gc"+k);if(!box||box.dataset.done)return;box.dataset.done="1";

    <button class="alt wide mmbtn" onclick="mmHub()">🧮 Mental math gym · tricks, drills, sprint</button>
    <button class="alt wide" onclick="startMock()">📝 ${run?"New mock test (replaces saved)":"Mock test · 20 questions · 20 min · no hints"}</button>
    <button class="alt wide" onclick="importScreen()">📥 Import questions${CUSTOM.length?` (${CUSTOM.length} added)`:""}</button></div>
  ${w?`<div class="weak"><div><b>🎯 Weakest topic: ${TOPIC_NAME[w.t]}</b><br><small>${Math.round(w.acc*100)}% accuracy · ${w.avg.toFixed(1)}s avg</small></div>
    <button class="alt" onclick="start('weak')">Practice weakest topic</button></div>`
    :`<div class="weak"><small>🎯 Answer 3+ questions in a topic to unlock your weakest-topic card.</small></div>`}
  <h3>Stats</h3>${statsTable()}
  <h3>Badges (${P.badges.filter(k=>BADGES[k]).length}/${Object.keys(BADGES).length})</h3>
  <div class="badges">${Object.entries(BADGES).map(([k,b])=>`<div class="badge ${P.badges.includes(k)?"":"locked"}"><span aria-hidden="true">${b.i}</span><span>${b.n}<small>${b.d}</small></span></div>`).join("")}</div></div>
  <div class="dock"><button class="main" onclick="start()">Start Quest${topic==="All"?"":" · "+topic} ▶</button></div>`;
}

function start(mode="quest"){
  if(mode==="mock")return startMock();
  let qs=[],label,adaptive=false,topicSel="All";
  if(mode==="daily"){qs=shuffle(window.QUESTIONS||[],seeded("aq-daily-"+dayKey())).slice(0,10);label="📅 Daily"}
  else if(mode==="review"){qs=reviewPick(10);label="🔁 Review";if(!qs.length)return home("No mistakes to review yet. Go make some! 😄")}
  else{if(mode==="weak"){const w=weakest();if(!w)return home();topicSel=w.t;label="🎯 "+w.t}else{topicSel=topic;label="⚔️ "+topic}
    if(!BANK.some(q=>topicSel==="All"||q.topic===topicSel)&&!(GEN&&/^(All|Quant)$/.test(topicSel)))return home("No questions found for this topic yet.");
    adaptive=true}
  if(!adaptive&&!qs.length)return home("No questions found yet.");
  clearInterval(tick);M=null;SFX.click();
  G={mode,label,qs,i:0,lives:3,combo:0,max:0,xp:0,right:0,new:[],total:adaptive?10:qs.length,
     adaptive,key:topicSel,topicSel,level:adaptive?(P.adapt[topicSel]||1):0,up:0,down:0,seen:new Set()};
  ask();
}

function ask(){
  if(G.adaptive&&!G.qs[G.i]){const nq=pickAdaptive();if(!nq)return end();G.qs.push(nq)}
  const q=G.qs[G.i];G.seen.add(q.id);Object.assign(G,{locked:false,used:0,resumeAt:Date.now(),paused:false,limit:qLimit(q)});G.lastS=G.limit;
  $("#app").innerHTML=`<div class="screen">
  <div class="qhead"><button class="icon" onclick="quit()" aria-label="Quit to home">✕</button>
    <span class="grow">${G.label} · Q ${G.i+1}/${G.total} · ${TOPIC_NAME[q.topic]||esc(q.topic)} ${"★".repeat(q.difficulty||1)}${q.custom?" · imported":""}</span>${soundBtn()}</div>
  <div class="row"><span>⏱ <b id="tt">${G.limit}</b>s</span><span>${G.adaptive?`<span class="lvtag">Level ${G.level}/3</span> · `:""}🔥 x${G.combo} · ⭐ ${G.xp} · <span aria-label="${G.lives} lives">${"❤️".repeat(G.lives)}${"🖤".repeat(3-G.lives)}</span></span></div>
  <div class="bar"><div id="tb" style="width:100%"></div></div>
  <div class="note" id="pause" hidden>⏸ The timer paused while you were away.</div>
  <h2>${esc(q.q)}</h2>
  ${q.data?table(q.data):""}
  <div class="opts">${q.o.map((o,k)=>`<button class="opt" onclick="answer(${k})"><kbd>${k+1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>
  <div id="fb"></div></div>
  <div class="dock"><button class="main" id="next" onclick="next()" disabled>Tap an answer</button></div>`;
  hintTables();scrollTo(0,0);startTick();
}

function answer(k){
  if(!G||G.over||G.locked)return;G.locked=true;clearInterval(tick);
  const q=G.qs[G.i],secs=Math.min(G.limit,elapsed()),ok=k===q.a,near=k!==-1&&secs>=G.limit-3,sjt=q.topic==="SJT";
  const wasBoxed=!!P.box[lkey(q)],nb=G.new.length;
  rec(q,ok,secs);
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("good");else if(j===k)b.classList.add("bad")});
  let msg,face;
  if(ok){
    G.combo++;G.max=Math.max(G.max,G.combo);G.right++;
    const gain=10+Math.max(0,10-Math.round(secs/G.limit*20))+5*Math.min(G.combo-1,4)+5*((q.difficulty||1)-1);
    G.xp+=gain;
    award("first");if(G.combo>=5)award("fire");if(G.combo>=10)award("unstop");
    if(secs<5)award("speed");if(near)award("clutch");if(G.mode==="review"&&wasBoxed)award("comeback");
    msg=pick(MEMES.streak[G.combo]||(near?MEMES.near.good:sjt?FUN2.sjtGood:MEMES.good))+` <b>+${gain} XP</b>`;
    face=MEMES.streak[G.combo]?"cool":near?"wow":"happy";SFX.good();buzz(30);
  }else{
    G.lives--;G.combo=0;
    msg=pick(k===-1?MEMES.time:near?MEMES.near.bad:sjt?FUN2.sjtBad:MEMES.bad);
    face=k===-1?"wow":"sad";SFX.bad();buzz([60,50,60]);
  }
  const ch=adaptStep(ok);save();
  const fresh=G.new.slice(nb);if(fresh.length)setTimeout(SFX.badge,250);
  const last=G.lives<=0||G.i===G.total-1;
  const reasons=sjt?`<h3>How each response rates</h3>${optionReasons(q,k)}`
    :`${k>=0&&!ok&&q.why?`<div class="trap">🪤 Why “${esc(q.o[k])}” tempts: ${esc(q.why[k])}</div>`:""}
      ${q.why?`<details class="more"><summary>Why each option is right or wrong</summary>${optionReasons(q,k)}</details>`:""}`;
  $("#fb").innerHTML=`<div class="meme ${ok?"good":"bad"}" role="status"><span class="face ${face}"></span><span>${msg}</span></div>
  ${ch?`<div class="note lvchg">${ch>0?"📈 Difficulty up":"📉 Difficulty down"}: level ${G.level}/3 · ${pick(ch>0?FUN2.levelUp:FUN2.levelDown)}</div>`:""}
  ${fresh.map(b=>`<div class="note">🏅 New badge: ${BADGES[b].i} <b>${BADGES[b].n}</b> · ${BADGES[b].d}</div>`).join("")}
  <p class="exp">💡 ${esc(q.e)}</p>
  ${reasons}
  ${q.tip?`<div class="tip">⚡ ${sjt?"Rule of thumb":"Shortcut"}: ${esc(q.tip)}</div>`:""}`;
  const nx=$("#next");nx.disabled=false;nx.innerHTML=`${last?"Finish 🏁":"Next ▶"} <small class="kb">(Enter)</small>`;
  $("#fb").scrollIntoView({block:"nearest",behavior:reduced()?"auto":"smooth"});
}

function next(){
  if(!G||G.over||!G.locked)return;
  G.i++;
  if(G.lives<=0||G.i>=G.total)end();else ask();
}

function end(){
  clearInterval(tick);G.over=true;
  const n=G.total,pct=Math.round(G.right/n*100),done=G.lives>0;
  if(pct===100&&n>=5)award("perfect");
  if(G.mode==="daily"&&done){award("daily");const prev=P.daily.date===dayKey()?P.daily.score:0;P.daily={date:dayKey(),score:Math.max(prev,G.right),n}}
  bumpStreak();if(P.streak.n>=3)award("streak3");
  const before=lvl(P.xp);P.xp+=G.xp;P.best=Math.max(P.best,G.xp);
  const up=lvl(P.xp)>before;if(lvl(P.xp)>=5)award("level5");
  save();
  const rank=pct>=90?"🧙 Aptitude Wizard":pct>=70?"😎 Big Brain":pct>=50?"🙂 Getting There":"🥔 Potato (with potential)";
  $("#app").innerHTML=`<div class="screen">
  <h1>${done?"🎉 Quest complete":"💀 Out of lives"}</h1>
  ${up?`<div class="lvlup">⬆️ Level up! You're now level ${lvl(P.xp)}</div>`:""}
  <h2>${rank}</h2>
  <p>Score: ${G.right}/${n} (${pct}%)<br>XP earned: ${G.xp}<br>Best combo: ${G.max}x<br>🔥 Day streak: ${curStreak()}${G.adaptive?`<br>🎚️ Difficulty now: level ${G.level}/3`:""}</p>
  ${G.new.length?`<p>New badges: ${G.new.map(k=>BADGES[k].i+" "+BADGES[k].n).join(", ")}</p>`:""}
  <p class="joke">😂 ${pick(JOKES)}</p></div>
  <div class="dock"><button class="main" onclick="start('${G.mode}')">Play again 🔁</button>
  <button class="alt" onclick="home()">Home</button></div>`;
  scrollTo(0,0);
  if(up){confetti();SFX.level();buzz([30,40,30,40,80])}
}

// Desktop shortcuts (optional; every action also has a tap target)
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||/^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName))return;
  if(MMS){const map={Backspace:"⌫",Enter:"ok","-":"−",".":".",",":".",h:"hint",H:"hint"};const k=/^[0-9]$/.test(e.key)?e.key:map[e.key];if(k){e.preventDefault();mmKey(k)}return}
  if(M&&!M.over){
    if(e.key>="1"&&e.key<="4"){e.preventDefault();mockSelect(+e.key-1)}
    else if(e.key==="ArrowRight"||e.key==="Enter"){e.preventDefault();M.i<M.qs.length-1?mockGo(M.i+1):mockSubmit()}
    else if(e.key==="ArrowLeft"){e.preventDefault();mockGo(M.i-1)}
    return}
  if(!G||G.over)return;
  if(!G.locked&&e.key>="1"&&e.key<="4"){const k=+e.key-1;if(k<G.qs[G.i].o.length){e.preventDefault();answer(k)}}
  else if(G.locked&&e.key==="Enter"){e.preventDefault();next()}
});

// Screen lock / app switch: pause the timers, save the mock test, quiet the audio.
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    if(M&&!M.over&&!M.paused){mockLeave();M.used+=Date.now()-M.resumeAt;M.paused=true;saveRun()}
    if(MMS&&!MMS.paused){if(MMS.mode==="sprint")MMS.pausedLeft=MMS.sprintEnd-Date.now();else MMS.used+=Date.now()-MMS.t0;MMS.paused=true}
    if(G&&!G.over&&!G.locked&&!G.paused){G.used+=Date.now()-G.resumeAt;G.paused=true}
    try{AC&&AC.state==="running"&&AC.suspend().catch(()=>{})}catch(e){}
  }else{
    if(MMS&&MMS.paused){MMS.paused=false;if(MMS.mode==="sprint")MMS.sprintEnd=Date.now()+MMS.pausedLeft;else MMS.t0=Date.now();const n=$("#pause");if(n)n.hidden=false}
    if(M&&!M.over&&M.paused){M.paused=false;M.resumeAt=Date.now();M.qStart=Date.now();const n=$("#pause");if(n)n.hidden=false}
    if(G&&!G.over&&!G.locked&&G.paused){G.paused=false;G.resumeAt=Date.now();const n=$("#pause");if(n)n.hidden=false}
  }
});
addEventListener("pagehide",()=>{mockLeave();saveRun()});

// Offline install: service workers only run over https (or localhost), never on file://.
if("serviceWorker" in navigator&&(location.protocol==="https:"||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

home();
</script>
</body>
</html>
